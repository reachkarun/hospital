x-environment: &environment
  DEMO_MODE: ${DEMO_MODE:-true}
  HOST: 0.0.0.0
  AUTH_TOKENS: ${AUTH_TOKENS:-}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${DB_NAME:-rounding_app}
  DB_USER: ${DB_USER:-rounding_app}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  BILLING_TOKEN: ${BILLING_TOKEN:-demo-billing-secret}
  PATIENT_SERVICE_TOKEN: ${PATIENT_SERVICE_TOKEN:-demo-patient-service-secret}
  BILLING_SERVICE_TOKEN: ${BILLING_SERVICE_TOKEN:-demo-billing-service-secret}
  PATIENT_SERVICE_URL: http://patient-service:3101
  CHARGE_SERVICE_URL: http://charge-service:3102
  BILLING_SERVICE_URL: http://billing-service:3103

x-app: &app
  environment: *environment
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 -uroot --silent",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  gateway:
    <<: *app
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *environment
      PORT: 3002
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  patient-service:
    <<: *app
    build:
      context: .
      dockerfile: services/patient-service/Dockerfile
    environment:
      <<: *environment
      PORT: 3101
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  charge-service:
    <<: *app
    build:
      context: .
      dockerfile: services/charge-service/Dockerfile
    environment:
      <<: *environment
      PORT: 3102
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  billing-service:
    <<: *app
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    environment:
      <<: *environment
      PORT: 3103
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
  billing-mock:
    <<: *app
    build:
      context: .
      dockerfile: services/billing-mock/Dockerfile
    environment:
      <<: *environment
      PORT: 4001
    ports:
      - "127.0.0.1:4001:4001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  mysql-data:
