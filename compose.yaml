x-environment: &environment
  DEMO_MODE: "true"
  HOST: 0.0.0.0
  BILLING_URL: http://billing-mock:4001/api/v1
  BILLING_TOKEN: demo-billing-secret
  PATIENT_SERVICE_URL: http://patient-service:3101
  CHARGE_SERVICE_URL: http://charge-service:3102
  BILLING_SERVICE_URL: http://billing-service:3103

services:
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *environment
      PORT: 3002
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3002}:3002"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  patient-service:
    build:
      context: .
      dockerfile: services/patient-service/Dockerfile
    environment:
      <<: *environment
      PORT: 3101
      PATIENT_SERVICE_TOKEN: demo-patient-service-secret
      DATABASE_PATH: /app/data/patients.db
    volumes:
      - patient-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3101/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  charge-service:
    build:
      context: .
      dockerfile: services/charge-service/Dockerfile
    environment:
      <<: *environment
      PORT: 3102
      PATIENT_SERVICE_TOKEN: demo-patient-service-secret
      BILLING_SERVICE_TOKEN: demo-billing-service-secret
      DATABASE_PATH: /app/data/charges.db
    volumes:
      - charge-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3102/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    environment:
      <<: *environment
      PORT: 3103
      BILLING_SERVICE_TOKEN: demo-billing-service-secret
      DATABASE_PATH: /app/data/billing.db
    volumes:
      - billing-service-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3103/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  billing-mock:
    build:
      context: .
      dockerfile: services/billing-mock/Dockerfile
    environment:
      <<: *environment
      PORT: 4001
      DATABASE_PATH: /app/data/billing.db
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - billing-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  patient-data:
  charge-data:
  billing-service-data:
  billing-data:
